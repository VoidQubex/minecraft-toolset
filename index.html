<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Give Command Generator | 26.1.2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #121212;
            --bg-tertiary: #1a1a1a;
            --bg-glass: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-primary: #e8e8e8;
            --text-secondary: #909090;
            --accent: #2d9cdb;
            --accent-hover: #45a9e6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        body {
            background: #000000;
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(45, 156, 219, 0.03) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(45, 156, 219, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            z-index: 1;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--text-primary);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .glass-panel {
            background: var(--bg-glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-tertiary);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            font-weight: 500;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .items-section {
            margin-bottom: 30px;
        }

        .search-box {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-bottom: 12px;
        }

        .search-box:hover {
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(45, 156, 219, 0.1);
        }

        .search-box::placeholder {
            color: var(--text-secondary);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            max-height: 280px;
            overflow-y: auto;
            padding: 5px;
        }

        .item-button {
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.8rem;
            text-align: center;
            word-break: break-word;
            font-weight: 500;
            text-transform: capitalize;
            font-family: inherit;
        }

        .item-button:hover {
            border-color: var(--accent);
            background: rgba(45, 156, 219, 0.08);
        }

        .item-button.active {
            border-color: var(--accent);
            background: rgba(45, 156, 219, 0.15);
            box-shadow: 0 0 12px rgba(45, 156, 219, 0.25);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:hover,
        input[type="number"]:hover {
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(45, 156, 219, 0.1);
        }

        input[type="text"]::placeholder,
        input[type="number"]::placeholder {
            color: var(--text-secondary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox-group:hover {
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .checkbox-label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .enchant-section {
            margin-bottom: 25px;
        }

        .enchant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }

        .enchant-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .enchant-item:hover {
            border-color: var(--accent);
            background: rgba(45, 156, 219, 0.08);
        }

        .enchant-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
        }

        .enchant-item label {
            margin: 0;
            font-size: 0.9rem;
            font-weight: normal;
            cursor: pointer;
            text-transform: none;
            letter-spacing: normal;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(45, 156, 219, 0.25);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(45, 156, 219, 0.35);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            background: rgba(45, 156, 219, 0.08);
        }

        .output-section {
            margin-top: 30px;
            padding: 20px;
            background: var(--bg-glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: none;
        }

        .output-section.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .output-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
            font-weight: 600;
        }

        .output-command {
            background: #000000;
            border: 1px solid rgba(45, 156, 219, 0.3);
            border-radius: 10px;
            padding: 16px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9rem;
            color: var(--accent);
            word-break: break-all;
            margin-bottom: 12px;
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-btn:hover {
            background: var(--accent-hover);
        }

        .copy-btn.copied {
            background: var(--success);
        }

        .info-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .items-grid::-webkit-scrollbar,
        .enchant-grid::-webkit-scrollbar {
            width: 8px;
        }

        .items-grid::-webkit-scrollbar-track,
        .enchant-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .items-grid::-webkit-scrollbar-thumb,
        .enchant-grid::-webkit-scrollbar-thumb {
            background: rgba(45, 156, 219, 0.2);
            border-radius: 4px;
        }

        .items-grid::-webkit-scrollbar-thumb:hover,
        .enchant-grid::-webkit-scrollbar-thumb:hover {
            background: rgba(45, 156, 219, 0.3);
        }

        .tooltip {
            position: relative;
            display: inline-block;
            cursor: help;
            margin-left: 5px;
            color: var(--accent);
            font-weight: 600;
        }

        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            white-space: nowrap;
            font-size: 0.8rem;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Minecraft Give Command Generator</h1>
            <p>Version 26.1.2</p>
        </div>

        <div class="glass-panel">
            <div class="stats" id="stats">
                <div class="stat-card">
                    <div class="stat-value" id="itemCount">0</div>
                    <div class="stat-label">Items Available</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="enchantCount">0</div>
                    <div class="stat-label">Enchantments Available</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="selectedEnchants">0</div>
                    <div class="stat-label">Selected Enchants</div>
                </div>
            </div>

            <form id="commandForm">
                <div class="items-section">
                    <div class="section-title">
                        Select an Item
                    </div>
                    <input type="text" id="itemSearch" class="search-box" placeholder="Search items...">
                    <div class="items-grid" id="itemsGrid">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="count">Count</label>
                        <input type="number" id="count" value="1" min="1" max="64">
                    </div>

                    <div class="form-group">
                        <label for="searchEnchant">Search Enchantments</label>
                        <input type="text" id="searchEnchant" placeholder="Type to search...">
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="allEnchantsCheck">
                        <label for="allEnchantsCheck" class="checkbox-label">
                            All Enchants (Max Level)
                        </label>
                    </div>
                </div>

                <div class="enchant-section">
                    <label class="section-title">
                        Or Select Individual Enchantments
                    </label>
                    <div class="enchant-grid" id="enchantGrid">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">Generate Command</button>
                    <button type="reset" class="btn-secondary">Reset</button>
                </div>
            </form>

            <div class="output-section" id="outputSection">
                <span class="output-label">Generated Command</span>
                <div class="output-command" id="commandOutput">
                    <button class="copy-btn" onclick="copyCommand()">Copy</button>
                    <span id="commandText"></span>
                </div>
                <p class="info-text">💡 Paste this command directly into your Minecraft chat with cheats enabled!</p>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
